<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">DJ_Nocide</title>
  <desc id="d">Animated banner: DJ_Nocide, cybersecurity, digital forensics and tool builder.</desc>
  <defs>
    <clipPath id="round"><rect width="900" height="240" rx="12"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff9c" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#grid)"/>

    <!-- scanning line -->
    <rect width="900" height="46" y="-46" fill="url(#scan)">
      <animate attributeName="y" from="-46" to="240" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g fill="none" stroke="#00ff9c" stroke-width="2" stroke-opacity="0.8">
      <path d="M20 44V20H44"/>
      <path d="M856 20H880V44"/>
      <path d="M20 196V220H44"/>
      <path d="M880 196V220H856"/>
    </g>

    <!-- glitch layers -->
    <g font-family="'Courier New', Courier, monospace" font-size="76" font-weight="700" text-anchor="middle">
      <text x="450" y="120" fill="#ff2e88" fill-opacity="0.7">DJ_Nocide
        <animate attributeName="x" values="447;453;447;447;450;447" keyTimes="0;0.05;0.1;0.6;0.65;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="120" fill="#19d3ff" fill-opacity="0.7">DJ_Nocide
        <animate attributeName="x" values="453;447;453;453;450;453" keyTimes="0;0.05;0.1;0.6;0.65;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="120" fill="#00ff9c">DJ_Nocide</text>
    </g>

    <!-- subtitle -->
    <g font-family="'Courier New', Courier, monospace" text-anchor="middle">
      <text x="450" y="166" font-size="18" fill="#b8ffe6">&gt; CYBERSECURITY // DIGITAL FORENSICS // TOOL BUILDER</text>
      <text x="450" y="205" font-size="14" fill="#9fb0c3">[ career switch in progress ]</text>
    </g>

    <!-- blinking cursor -->
    <rect x="788" y="150" width="10" height="18" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
