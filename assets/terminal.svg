<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Terminal session</title>
  <desc id="d">A terminal typing: whoami returns screwedpulick. Focus: web dev to cybersecurity, forensics, networking. Tools: ghostz, sigz, portz, vaultz.</desc>
  <defs>
    <clipPath id="c1"><rect x="24" y="62" width="0" height="24"><animate attributeName="width" from="0" to="770" begin="0.5s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="88" width="0" height="24"><animate attributeName="width" from="0" to="770" begin="1.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="24" y="124" width="0" height="24"><animate attributeName="width" from="0" to="770" begin="2.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="24" y="150" width="0" height="24"><animate attributeName="width" from="0" to="770" begin="3.4s" dur="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="24" y="186" width="0" height="24"><animate attributeName="width" from="0" to="770" begin="5.3s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="24" y="212" width="0" height="24"><animate attributeName="width" from="0" to="770" begin="6.4s" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="818" height="298" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 11A10 10 0 0 1 11 1H809A10 10 0 0 1 819 11V38H1Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="410" y="25" font-family="'Courier New', Courier, monospace" font-size="13" fill="#9fb0c3" text-anchor="middle">screwedpulick@lab: ~</text>

  <g font-family="'Courier New', Courier, monospace" font-size="17">
    <text x="24" y="80" clip-path="url(#c1)"><tspan fill="#00ff9c">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    <text x="24" y="106" clip-path="url(#c2)" fill="#b8ffe6">screwedpulick</text>

    <text x="24" y="142" clip-path="url(#c3)"><tspan fill="#00ff9c">$ </tspan><tspan fill="#e6edf3">cat focus.txt</tspan></text>
    <text x="24" y="168" clip-path="url(#c4)" fill="#79c0ff">web dev -&gt; cybersecurity | forensics | networking</text>

    <text x="24" y="204" clip-path="url(#c5)"><tspan fill="#00ff9c">$ </tspan><tspan fill="#e6edf3">ls ~/tools</tspan></text>
    <text x="24" y="230" clip-path="url(#c6)" fill="#b8ffe6">ghostz/   sigz/   portz/   vaultz/</text>

    <text x="24" y="266" opacity="0"><tspan fill="#00ff9c">$ </tspan>
      <animate attributeName="opacity" from="0" to="1" begin="7.6s" dur="0.01s" fill="freeze"/>
    </text>
  </g>

  <rect x="46" y="252" width="10" height="18" fill="#00ff9c" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="7.6s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
